# Trois façons d'exposer LiveChat, au choix, via les profils Compose :
#
#   docker compose --profile cloudflare up -d   tunnel Cloudflare, aucun port ouvert
#   docker compose --profile caddy up -d        Caddy + Let's Encrypt, ports 80/443
#   docker compose up -d                        rien devant, à mettre derrière son
#                                               propre reverse proxy
#
# install.sh choisit pour vous. Le profil retenu est mémorisé dans .env
# (COMPOSE_PROFILES), donc les commandes suivantes n'ont plus besoin du drapeau.

services:
  livechat:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - livechat-data:/data
    expose:
      - "3000"
    # Publié sur la boucle locale seulement : pratique pour un curl de contrôle,
    # inatteignable depuis l'extérieur.
    ports:
      - "127.0.0.1:3000:3000"

  # -- Tunnel Cloudflare ------------------------------------------------------
  # Le tunnel se connecte sortant vers Cloudflare : aucun port entrant à ouvrir,
  # rien à faire sur la box ou le pare-feu, et le certificat est géré par eux.
  # Le jeton vient du tableau de bord Zero Trust, où vous déclarez le nom de
  # domaine public et le service http://livechat:3000.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Renseignez CLOUDFLARE_TUNNEL_TOKEN dans .env}
    depends_on:
      - livechat

  # -- Caddy ------------------------------------------------------------------
  # Certificat Let's Encrypt automatique. Demande que 80 et 443 soient ouverts
  # et que le domaine pointe sur cette machine.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["caddy"]
    environment:
      DOMAIN: ${DOMAIN:?Renseignez DOMAIN dans .env, par exemple livechat.exemple.fr}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - livechat

volumes:
  livechat-data:
  caddy-data:
  caddy-config:
