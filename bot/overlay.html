<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }

  #overlay {
    position: fixed;
    bottom: 40px;
    right: 40px;
    max-width: 45%;
    opacity: 0;
    transform: translateY(20px) scale(0.95);
    transition: opacity 0.4s ease, transform 0.4s ease;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  }

  #overlay.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  #overlay.hiding {
    opacity: 0;
    transform: translateY(-12px) scale(0.96);
  }

  #media-wrap img,
  #media-wrap video {
    display: block;
    max-width: 100%;
    max-height: 65vh;
    width: auto;
    height: auto;
  }

  #author-tag {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    color: #fff;
    padding: 28px 12px 10px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<div id="overlay">
  <div id="media-wrap">
    <div id="author-tag"></div>
  </div>
</div>

<script>
  const overlay   = document.getElementById('overlay');
  const mediaWrap = document.getElementById('media-wrap');
  const authorTag = document.getElementById('author-tag');

  let hideTimer = null;

  function showMedia(data) {
    clearTimeout(hideTimer);

    overlay.classList.remove('hiding', 'visible');
    const old = mediaWrap.querySelector('img, video');
    if (old) old.remove();

    let el;
    if (data.type === 'video') {
      el = document.createElement('video');
      el.src      = data.url;
      el.autoplay = true;
      el.muted    = false;
      el.controls = false;
      el.onended  = hide;
    } else {
      el = document.createElement('img');
      el.src = data.url;
      hideTimer = setTimeout(hide, (data.duration || 8) * 1000);
    }

    mediaWrap.insertBefore(el, authorTag);
    authorTag.textContent = data.author || '';

    requestAnimationFrame(() =>
      requestAnimationFrame(() => overlay.classList.add('visible'))
    );
  }

  function hide() {
    clearTimeout(hideTimer);
    overlay.classList.add('hiding');
    overlay.classList.remove('visible');
    setTimeout(() => {
      overlay.classList.remove('hiding');
      const old = mediaWrap.querySelector('img, video');
      if (old) old.remove();
    }, 500);
  }

  // WebSocket — se connecte automatiquement au même serveur que la page
  function connect() {
    const ws = new WebSocket(`ws://${window.location.host}/ws`);
    ws.onmessage = (e) => {
      try { showMedia(JSON.parse(e.data)); } catch (err) { console.error(err); }
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }

  connect();
</script>
</body>
</html>
